<script type="application/json" id="apps-script-code">// ============================================================
// TUTOR TRACKER — Multi-User Apps Script backend
// CONTAINER-BOUND: paste this INSIDE the Sheet it belongs to
// (Extensions -> Apps Script). It uses the Sheet it lives in,
// so there is NO spreadsheet ID to configure. This is what
// makes it work for anyone who copies the template Sheet.
// ============================================================

var LIVE_SHEET_NAME    = "Live_Sessions";
var ARCHIVE_SHEET_NAME = "Archive";

var LIVE_HEADERS = ["Timestamp","Date","Student","Complete","Paid","Amount","Notes","Session ID"];
var ARCHIVE_HEADERS = ["Timestamp","Date","Student","Complete","Paid","Amount","Notes","Session ID","Bulk Import"];

var A_TS=1, A_DATE=2, A_STU=3, A_DONE=4, A_PAID=5, A_AMT=6, A_NOTES=7, A_SID=8, A_BULK=9;

function doGet(e)  { return handleRequest(e); }
function doPost(e) { return handleRequest(e); }

function handleRequest(e) {
  try {
    var payload = parsePayload(e);
    if (!payload) return jsonResponse({ status:"ok", message:"Tutor Tracker webhook active" });
    var action = payload.action || "";
    if (action === "sync_all")    return jsonResponse(syncAllSessions(payload.sessions||[], payload.students||[]));
    if (action === "log" && payload.session)          return jsonResponse(logSingleSession(payload.session, payload.students||[]));
    if (action === "update_paid" && payload.session)  return jsonResponse(updateLivePaid(payload.session));
    return jsonResponse({ status:"error", message:"Unknown action: "+action });
  } catch (err) {
    return jsonResponse({ status:"error", message:String(err) });
  }
}

function parsePayload(e) {
  if (e && e.postData && e.postData.contents) return JSON.parse(e.postData.contents);
  if (e && e.parameter && e.parameter.payload) return JSON.parse(e.parameter.payload);
  return null;
}

function jsonResponse(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

// Uses the Sheet this script is bound to — no ID needed.
function getBook() { return SpreadsheetApp.getActiveSpreadsheet(); }

function getOrCreateSheet(name, headers) {
  var book = getBook();
  var sh = book.getSheetByName(name);
  if (!sh) {
    sh = book.insertSheet(name);
    sh.getRange(1,1,1,headers.length).setValues([headers]).setFontWeight("bold");
    sh.setFrozenRows(1);
  }
  return sh;
}

function sanitizeCell(v) {
  if (typeof v === "string" && /^[=+\-@]/.test(v)) return "'" + v;
  return v;
}

function buildBulkImport(dateStr, student, complete, paid, amount, notes) {
  return [dateStr, student, complete?"Yes":"No", paid?"Yes":"No", amount, notes||""].join("|") + "|";
}

function studentName(students, id) {
  for (var i=0;i<students.length;i++) if (students[i].id===id) return students[i].name;
  return "Unknown";
}

function findRowBySessionId(sh, sidCol, sid) {
  var last = sh.getLastRow();
  if (last < 2) return -1;
  var ids = sh.getRange(2, sidCol, last-1, 1).getValues();
  for (var i=0;i<ids.length;i++) if (String(ids[i][0])===String(sid)) return i+2;
  return -1;
}

function logSingleSession(s, students) {
  var live = getOrCreateSheet(LIVE_SHEET_NAME, LIVE_HEADERS);
  var arch = getOrCreateSheet(ARCHIVE_SHEET_NAME, ARCHIVE_HEADERS);
  var name = s.studentName || studentName(students, s.studentId);
  var now = new Date();

  // Live: update if exists, else append
  var lrow = findRowBySessionId(live, 8, s.id);
  var liveRow = [now, s.date, sanitizeCell(name), s.complete?"Yes":"No", s.paid?"Yes":"No", s.amount, sanitizeCell(s.notes||""), s.id];
  if (lrow > 0) live.getRange(lrow,1,1,LIVE_HEADERS.length).setValues([liveRow]);
  else live.appendRow(liveRow);

  // Archive: append only if this Session ID isn't already there
  if (findRowBySessionId(arch, A_SID, s.id) < 0) {
    arch.appendRow([now, s.date, sanitizeCell(name), s.complete?"Yes":"No", s.paid?"Yes":"No", s.amount,
      sanitizeCell(s.notes||""), s.id, buildBulkImport(s.date, name, s.complete, s.paid, s.amount, s.notes)]);
  }
  return { status:"ok", action:"log" };
}

function updateLivePaid(s) {
  var live = getBook().getSheetByName(LIVE_SHEET_NAME);
  var arch = getBook().getSheetByName(ARCHIVE_SHEET_NAME);
  var result = { live:"not_found", archive:"not_found" };
  var now = new Date();

  if (live) {
    var lr = findRowBySessionId(live, 8, s.id);
    if (lr > 0) {
      live.getRange(lr,1).setValue(now);
      live.getRange(lr,5).setValue(s.paid?"Yes":"No");
      result.live = "updated";
    }
  }
  if (arch) {
    var ar = findRowBySessionId(arch, A_SID, s.id);
    if (ar > 0) {
      var row = arch.getRange(ar,1,1,ARCHIVE_HEADERS.length).getValues()[0];
      arch.getRange(ar, A_TS).setValue(now);
      arch.getRange(ar, A_PAID).setValue(s.paid?"Yes":"No");
      arch.getRange(ar, A_BULK).setValue(
        buildBulkImport(row[A_DATE-1], row[A_STU-1], row[A_DONE-1]==="Yes", s.paid, row[A_AMT-1], row[A_NOTES-1]));
      result.archive = "updated";
    }
  }
  return { status:"ok", action:"update_paid", result:result };
}

function syncAllSessions(sessions, students) {
  var live = getOrCreateSheet(LIVE_SHEET_NAME, LIVE_HEADERS);
  var arch = getOrCreateSheet(ARCHIVE_SHEET_NAME, ARCHIVE_HEADERS);
  var now = new Date();

  // Rewrite Live_Sessions from scratch
  if (live.getLastRow() > 1) live.getRange(2,1,live.getLastRow()-1,LIVE_HEADERS.length).clearContent();
  var liveRows = [];
  for (var i=0;i<sessions.length;i++) {
    var s = sessions[i];
    var name = s.studentName || studentName(students, s.studentId);
    liveRows.push([now, s.date, sanitizeCell(name), s.complete?"Yes":"No", s.paid?"Yes":"No", s.amount, sanitizeCell(s.notes||""), s.id]);
  }
  if (liveRows.length) live.getRange(2,1,liveRows.length,LIVE_HEADERS.length).setValues(liveRows);

  // Append any new Session IDs to Archive (never clears)
  var existing = {};
  if (arch.getLastRow() > 1) {
    var ids = arch.getRange(2,A_SID,arch.getLastRow()-1,1).getValues();
    for (var k=0;k<ids.length;k++) existing[String(ids[k][0])] = true;
  }
  var archRows = [];
  for (var j=0;j<sessions.length;j++) {
    var ss = sessions[j];
    if (existing[String(ss.id)]) continue;
    var nm = ss.studentName || studentName(students, ss.studentId);
    archRows.push([now, ss.date, sanitizeCell(nm), ss.complete?"Yes":"No", ss.paid?"Yes":"No", ss.amount,
      sanitizeCell(ss.notes||""), ss.id, buildBulkImport(ss.date, nm, ss.complete, ss.paid, ss.amount, ss.notes)]);
  }
  if (archRows.length) arch.getRange(arch.getLastRow()+1,1,archRows.length,ARCHIVE_HEADERS.length).setValues(archRows);

  return { status:"ok", action:"sync_all", live:liveRows.length, archived:archRows.length };
}
