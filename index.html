<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <title>Tutor Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Tutor Tracker"/>
  <meta name="theme-color" content="#ffffff"/>
  <link rel="manifest" href="./manifest.json"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <!-- React & ReactDOM UMD — no Babel needed, JSX is pre-compiled -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --bg:         #F2F4F8;
      --surface:    #FFFFFF;
      --border:     #E4E8F0;
      --primary:    #4F6BED;
      --primary-dk: #3A54D8;
      --primary-bg: #EEF1FD;
      --green:      #16A34A;
      --green-bg:   #DCFCE7;
      --red:        #DC2626;
      --red-bg:     #FEE2E2;
      --amber:      #D97706;
      --amber-bg:   #FEF3C7;
      --text:       #111827;
      --text2:      #4B5563;
      --text3:      #9CA3AF;
      --shadow-sm:  0 1px 4px rgba(0,0,0,0.07);
      --shadow:     0 4px 24px rgba(0,0,0,0.08);
      --r:          18px;
      --r-sm:       12px;
      --r-xs:       8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; padding-bottom: 88px; }
    input, textarea, select, button { font-family: 'Outfit', sans-serif; }
    input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
    input[type="color"] { width: 44px; height: 36px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; padding: 2px; background: none; }
    select option { background: white; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeUp 0.25s ease; }
    .card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .inp { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-xs); padding: 11px 14px; font-size: 15px; color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    .inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,107,237,0.12); background: #fff; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: var(--r-xs); cursor: pointer; font-weight: 600; font-size: 14px; padding: 10px 18px; transition: all 0.15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:active { background: var(--primary-dk); transform: scale(0.98); }
    .btn-ghost { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
    .btn-ghost:active { background: var(--bg); }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1.5px solid rgba(220,38,38,0.2); }
    .btn-lg { padding: 14px 24px; font-size: 16px; font-weight: 700; border-radius: var(--r-sm); }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: opacity 0.15s; }
    .badge:active { opacity: 0.7; }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-red   { background: var(--red-bg);   color: var(--red); }
    .badge-blue  { background: var(--primary-bg); color: var(--primary); }
    .badge-amber { background: var(--amber-bg); color: var(--amber); }
    .badge-gray  { background: var(--bg); color: var(--text2); border: 1px solid var(--border); }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--border); display: flex; padding: 8px 0 max(12px, env(safe-area-inset-bottom)); z-index: 100; }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: var(--r-xs); transition: all 0.15s; }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label { font-size: 11px; font-weight: 600; color: var(--text3); transition: color 0.15s; }
    .nav-btn.active .nav-label { color: var(--primary); }
    .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--primary); opacity: 0; transition: opacity 0.15s; margin-top: -2px; }
    .nav-btn.active .nav-dot { opacity: 1; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
    .day-btn { padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--border); background: transparent; color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .stat-card { background: var(--surface); border-radius: var(--r-sm); border: 1px solid var(--border); padding: 16px 12px; text-align: center; flex: 1; }
    .stat-value { font-size: 24px; font-weight: 800; line-height: 1.1; }
    .stat-label { font-size: 11px; font-weight: 600; color: var(--text3); margin-top: 2px; }
    .session-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .session-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .today-banner { background: linear-gradient(135deg, var(--primary) 0%, #6B7FEF 100%); border-radius: var(--r-sm); padding: 14px 16px; color: white; }
    .student-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; }
    .panel-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
    .check-btn { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; transition: all 0.15s; }
    .check-btn.checked { background: var(--green); border-color: var(--green); color: white; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
        .then(() => console.log("SW registered"))
        .catch(e => console.warn("SW failed:", e));
    });
  }
  window.SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxgdufKcV6mn_vo4Tp9UZs6SWJTGvuibLJ-g2BvRu3tpN8z8vgTmZOuesFYZh368JRO/exec";
</script>
<script>
const {
  useState,
  useEffect,
  useMemo
} = React;
const VALID_TABS = ["log", "history", "students"];
const tabFromLocation = () => {
  const p = new URLSearchParams(window.location.search);
  const t = p.get("tab");
  return VALID_TABS.includes(t) ? t : "log";
};
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const COLORS = ["#4F6BED", "#E05A2B", "#8B5CF6", "#059669", "#DB2777", "#D97706", "#0891B2"];
const DEFAULT_STUDENTS = [{
  id: "s1",
  name: "Shnaur Zalmen Tal",
  color: "#4F6BED",
  scheduledDays: [],
  rate: 30
}, {
  id: "s2",
  name: "Pinchas Tal",
  color: "#E05A2B",
  scheduledDays: [],
  rate: 30
}];

// ── Secure ID generation (fix 4.1) ─────────────────────────────
const genId = () => typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);

// ── Storage with error surfacing (fix 3.2) ──────────────────────
const store = {
  get: k => {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : null;
    } catch {
      return null;
    }
  },
  set: (k, v) => {
    try {
      localStorage.setItem(k, JSON.stringify(v));
      return true;
    } catch (e) {
      if (e.name === "QuotaExceededError") return "quota";
      return false;
    }
  }
};
const todayStr = () => new Date().toISOString().split("T")[0];
const todayDayIdx = () => new Date().getDay();
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", {
  month: "short",
  day: "numeric",
  year: "numeric"
});
const fmtShort = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", {
  month: "short",
  day: "numeric"
});

// ── Sanitize to prevent formula injection in Sheets (fix 2.1) ───
const sanitize = s => {
  if (typeof s !== "string") return s;
  return s.replace(/^[=+\-@\t\r]/, "'$&");
};
const parseImportLine = line => {
  const months = {
    jan: 0,
    feb: 1,
    mar: 2,
    apr: 3,
    may: 4,
    jun: 5,
    jul: 6,
    aug: 7,
    sep: 8,
    oct: 9,
    nov: 10,
    dec: 11,
    january: 0,
    february: 1,
    march: 2,
    april: 3,
    june: 5,
    july: 6,
    august: 7,
    september: 8,
    october: 9,
    november: 10,
    december: 11
  };
  const clean = line.trim().toLowerCase().replace(/(\d+)(st|nd|rd|th)/, "$1");
  const parts = clean.split(/\s+/);
  if (parts.length < 2) return null;
  const month = months[parts[0]];
  if (month === undefined) return null;
  const day = parseInt(parts[1]);
  if (isNaN(day)) return null;
  const year = new Date().getFullYear();
  const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  return {
    dateStr,
    complete: !parts.includes("pending"),
    paid: parts.includes("paid")
  };
};

// ── Advanced import: handles tabs, pipes, and Google Sheets quotes ──
const parseSpreadsheetRow = (row, students) => {
  let clean = row.trim();
  if (clean.startsWith('"') && clean.endsWith('"')) {
    clean = clean.slice(1, -1).replace(/""/g, '"');
  }
  let cols = clean.split('\t').map(c => c.trim());
  if (cols.length < 3) {
    cols = clean.split('|').map(c => c.trim());
    if (cols.length > 0 && cols[cols.length - 1] === '') cols.pop();
  }
  if (cols.length < 2) return null;
  const [dateStr, studentName, completeStr, paidStr, amountStr, notes] = cols;
  if (!dateStr || !studentName) return null;
  const st = students.find(s => s.name.toLowerCase() === studentName.toLowerCase());
  if (!st) return null;
  const complete = ['true', 'yes', '1', 'complete'].includes(completeStr?.toLowerCase());
  const paid = ['true', 'yes', '1', 'paid'].includes(paidStr?.toLowerCase());
  const amount = parseFloat(String(amountStr || '').replace(/[$,]/g, '')) || st.rate;
  return {
    dateStr,
    studentId: st.id,
    complete,
    paid,
    amount,
    notes: notes || ""
  };
};

// ── Sheets sync — no-cors is required for Google Apps Script.
//    GAS redirects POST requests (302) and browsers cannot read CORS
//    headers on the redirected response. This is a GAS limitation, not
//    a code bug. We inform the user it's "fire and forget" accordingly.
const postToSheets = async payload => {
  const url = window.SHEETS_WEBHOOK_URL;
  if (!url || url.includes("PASTE")) return {
    skipped: true
  };
  try {
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        ...payload,
        // Sanitize notes/names before sending to Sheets
        session: payload.session ? {
          ...payload.session,
          notes: sanitize(payload.session.notes),
          studentName: sanitize(payload.session.studentName)
        } : undefined
      })
    });
    return {
      status: "ok"
    };
  } catch (e) {
    return {
      error: e.message
    };
  }
};
function App() {
  const [students, setStudents] = useState(DEFAULT_STUDENTS);
  const [sessions, setSessions] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState(tabFromLocation);
  const [toast, setToast] = useState({
    msg: "",
    type: "info"
  });
  const [form, setForm] = useState({
    studentId: "s1",
    date: todayStr(),
    notes: "",
    complete: true
  });
  const [editingStudent, setEditingStudent] = useState(null);
  const [showAddStudent, setShowAddStudent] = useState(false);
  const [newStudent, setNewStudent] = useState({
    name: "",
    rate: 30,
    color: COLORS[0],
    scheduledDays: []
  });
  const [filterStudent, setFilterStudent] = useState("all");
  const [filterPaid, setFilterPaid] = useState("all");
  const [showBulk, setShowBulk] = useState(false);
  const [bulkText, setBulkText] = useState("");
  const [bulkMode, setBulkMode] = useState("simple");
  const [bulkStudentId, setBulkStudentId] = useState("");
  const [bulkResult, setBulkResult] = useState(null);
  const [showExport, setShowExport] = useState(false);
  useEffect(() => {
    const ss = store.get("tt-sessions");
    if (ss) setSessions(ss);
    const st = store.get("tt-students");
    if (st) setStudents(st);
    setLoaded(true);
  }, []);
  useEffect(() => {
    const url = new URL(window.location.href);
    if (url.searchParams.get("tab") !== tab) {
      url.searchParams.set("tab", tab);
      window.history.replaceState({}, "", url);
    }
  }, [tab]);
  useEffect(() => {
    const fn = () => setTab(tabFromLocation());
    window.addEventListener("popstate", fn);
    return () => window.removeEventListener("popstate", fn);
  }, []);

  // ── useMemo for derived stats — prevents recalculating on every keystroke (fix 3.1) ──
  const {
    totalDone,
    totalEarned,
    totalOwed
  } = useMemo(() => {
    let done = 0,
      earned = 0,
      owed = 0;
    sessions.forEach(s => {
      if (s.complete) {
        done++;
        if (s.paid) earned += s.amount;else owed += s.amount;
      }
    });
    return {
      totalDone: done,
      totalEarned: earned,
      totalOwed: owed
    };
  }, [sessions]);
  const filteredSessions = useMemo(() => sessions.filter(s => {
    if (filterStudent !== "all" && s.studentId !== filterStudent) return false;
    if (filterPaid === "paid" && !s.paid) return false;
    if (filterPaid === "unpaid" && s.paid) return false;
    return true;
  }), [sessions, filterStudent, filterPaid]);
  const studentStats = useMemo(() => students.map(st => {
    const mine = sessions.filter(s => s.studentId === st.id && s.complete);
    return {
      ...st,
      count: mine.length,
      earned: mine.filter(s => s.paid).reduce((a, s) => a + s.amount, 0),
      owed: mine.filter(s => !s.paid).reduce((a, s) => a + s.amount, 0)
    };
  }), [students, sessions]);
  const flash = (msg, type = "info", ms = 2500) => {
    setToast({
      msg,
      type
    });
    setTimeout(() => setToast({
      msg: "",
      type: "info"
    }), ms);
  };

  // ── Persist with storage error surfacing (fix 3.2) ──────────
  const persist = (ns, nst) => {
    if (ns != null) {
      const ok = store.set("tt-sessions", ns);
      if (ok === "quota") {
        flash("⚠️ Storage full — export your data now!", "error", 5000);
        return;
      }
      if (ok === false) {
        flash("⚠️ Could not save — check browser storage settings", "error", 5000);
        return;
      }
      setSessions(ns);
    }
    if (nst != null) {
      const ok = store.set("tt-students", nst);
      if (ok === "quota") {
        flash("⚠️ Storage full!", "error", 5000);
        return;
      }
      setStudents(nst);
    }
  };
  const getStudent = id => students.find(s => s.id === id) || {
    name: "Unknown",
    color: "#999",
    rate: 30,
    scheduledDays: []
  };
  const todayDI = todayDayIdx();
  const todaySuggestions = useMemo(() => students.filter(st => st.scheduledDays?.includes(todayDI)), [students, todayDI]);
  const loggedToday = sid => sessions.some(s => s.studentId === sid && s.date === todayStr() && s.complete);
  const doSync = async (session, studentName, action) => {
    await postToSheets({
      action,
      session: {
        ...session,
        studentName
      },
      students
    });
  };
  const syncAll = async () => {
    flash("Syncing to Sheets…", "info", 6000);
    const sessionsWithNames = sessions.map(s => ({
      ...s,
      studentName: getStudent(s.studentId).name
    }));
    const result = await postToSheets({
      action: "sync_all",
      sessions: sessionsWithNames,
      students
    });
    if (result?.error) flash(`Sync error: ${result.error}`, "error");else flash("Sent to Sheets (fire & forget — verify in your Sheet)", "info", 3500);
  };
  const logSession = async (overrides = {}) => {
    const merged = {
      ...form,
      ...overrides
    };
    if (!merged.studentId || !merged.date) return;
    const st = getStudent(merged.studentId);
    const session = {
      id: genId(),
      studentId: merged.studentId,
      date: merged.date,
      complete: merged.complete,
      paid: false,
      notes: merged.notes || "",
      amount: st.rate ?? 30
    };
    const updated = [session, ...sessions].sort((a, b) => b.date.localeCompare(a.date));
    persist(updated, null);
    setForm({
      studentId: merged.studentId,
      date: todayStr(),
      notes: "",
      complete: true
    });
    setTab("history");
    flash("Session logged ✓");
    doSync(session, st.name, "log");
  };
  const quickLog = sid => {
    const st = getStudent(sid);
    const session = {
      id: genId(),
      studentId: sid,
      date: todayStr(),
      complete: true,
      paid: false,
      notes: "",
      amount: st.rate ?? 30
    };
    const updated = [session, ...sessions].sort((a, b) => b.date.localeCompare(a.date));
    persist(updated, null);
    flash("Logged ✓");
    doSync(session, st.name, "log");
  };
  const togglePaid = id => {
    const u = sessions.map(s => s.id === id ? {
      ...s,
      paid: !s.paid
    } : s);
    const s = u.find(x => x.id === id);
    const st = getStudent(s.studentId);
    persist(u, null);
    doSync(s, st.name, "update_paid");
  };
  const toggleComplete = id => persist(sessions.map(s => s.id === id ? {
    ...s,
    complete: !s.complete
  } : s), null);
  const deleteSession = id => {
    if (!window.confirm("Delete this session?")) return;
    persist(sessions.filter(s => s.id !== id), null);
  };
  const saveEditStudent = () => {
    if (!editingStudent) return;
    const u = students.map(st => st.id === editingStudent.id ? {
      ...st,
      ...editingStudent,
      rate: Number(editingStudent.rate)
    } : st);
    persist(null, u);
    setEditingStudent(null);
    flash("Saved ✓");
  };
  const deleteStudent = id => {
    if (!window.confirm("Delete student? Sessions stay.")) return;
    persist(null, students.filter(s => s.id !== id));
  };
  const addStudent = () => {
    if (!newStudent.name.trim()) return;
    const ns = {
      id: genId(),
      name: newStudent.name.trim(),
      color: newStudent.color,
      rate: Number(newStudent.rate) || 30,
      scheduledDays: newStudent.scheduledDays
    };
    persist(null, [...students, ns]);
    setNewStudent({
      name: "",
      rate: 30,
      color: COLORS[0],
      scheduledDays: []
    });
    setShowAddStudent(false);
    flash("Student added ✓");
  };
  const toggleDay = (i, obj, setter) => {
    const days = obj.scheduledDays || [];
    setter({
      ...obj,
      scheduledDays: days.includes(i) ? days.filter(d => d !== i) : [...days, i]
    });
  };
  const runBulkImport = () => {
    if (bulkMode === "simple") {
      if (!bulkStudentId) {
        setBulkResult({
          error: "Select a student first."
        });
        return;
      }
      const st = getStudent(bulkStudentId);
      const lines = bulkText.split("\n").map(l => l.trim()).filter(Boolean);
      const imported = [],
        failed = [];
      for (const line of lines) {
        const p = parseImportLine(line);
        if (!p) {
          failed.push(line);
          continue;
        }
        if (sessions.some(s => s.studentId === bulkStudentId && s.date === p.dateStr)) {
          failed.push(`${line} (dup)`);
          continue;
        }
        imported.push({
          id: genId(),
          studentId: bulkStudentId,
          date: p.dateStr,
          complete: p.complete,
          paid: p.paid,
          notes: "(imported)",
          amount: st.rate ?? 30
        });
      }
      if (imported.length > 0) persist([...sessions, ...imported].sort((a, b) => b.date.localeCompare(a.date)), null);
      setBulkResult({
        imported: imported.length,
        failed
      });
    } else {
      const lines = bulkText.split("\n").map(l => l.trim()).filter(Boolean);
      const imported = [],
        failed = [];
      for (const line of lines) {
        const p = parseSpreadsheetRow(line, students);
        if (!p) {
          failed.push(line);
          continue;
        }
        if (sessions.some(s => s.studentId === p.studentId && s.date === p.dateStr)) {
          failed.push(`${line} (dup)`);
          continue;
        }
        imported.push({
          id: genId(),
          ...p,
          notes: p.notes || "(imported)"
        });
